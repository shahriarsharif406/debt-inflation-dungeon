<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Debt &amp; Inflation Dungeon: a FinLit roguelite</title>
<meta name="description" content="Debt monsters grow. Your cash melts. Survive 12 months in a financial-literacy roguelite. Rich or poor, the trap is the same.">
<meta name="theme-color" content="#06050c">
<meta property="og:title" content="Debt &amp; Inflation Dungeon">
<meta property="og:description" content="Debt grows. Cash melts. Your move. A financial-literacy roguelite you can play in 5 minutes.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2306050c'/%3E%3Cpath d='M16 76Q8 42 34 34Q50 27 66 34Q92 42 84 76Q50 92 16 76Z' fill='%23ff4d6d'/%3E%3Ccircle cx='38' cy='52' r='8' fill='%23fff'/%3E%3Ccircle cx='62' cy='52' r='8' fill='%23fff'/%3E%3Ccircle cx='40' cy='54' r='4' fill='%2314091a'/%3E%3Ccircle cx='60' cy='54' r='4' fill='%2314091a'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#06050c;--ink:#f5f2ff;--mute:#a49dcc;--line:#2b2650;--gold:#ffcf5c;--red:#ff4d6d;--amber:#ffb347;--green:#4de2a1;--blue:#6ea8ff;
  --glass:rgba(22,18,44,.74);--accent:#4aa3ff;--glow:#1f4f99;
}
body[data-floor="1"]{--accent:#ffb347;--glow:#8a5614}
body[data-floor="2"]{--accent:#ff4d6d;--glow:#8a1a36}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,"Segoe UI",-apple-system,Roboto,Helvetica,Arial,sans-serif;overflow-x:hidden}
body{background:
  radial-gradient(1000px 560px at 12% -12%,color-mix(in srgb,var(--glow) 55%,transparent),transparent 62%),
  radial-gradient(900px 520px at 105% 0%,color-mix(in srgb,var(--accent) 14%,transparent),transparent 58%),
  var(--bg);transition:background 1s}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#bg,#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#bg{z-index:0}#fx{z-index:40}
#flash{position:fixed;inset:0;z-index:39;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,transparent 40%,var(--fc,#fff) 130%)}
#flash.go{animation:fl .7s ease-out}
@keyframes fl{0%{opacity:.75}100%{opacity:0}}
#app{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:10px 14px 118px}
#app.shake{animation:shk .45s}
@keyframes shk{0%,100%{transform:none}15%{transform:translate(-7px,3px)}35%{transform:translate(6px,-4px)}55%{transform:translate(-4px,2px)}75%{transform:translate(3px,-1px)}}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
/* HUD */
#top{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:6px 2px 10px}
.brand{display:flex;align-items:center;gap:9px;font-weight:900;letter-spacing:.16em;font-size:12px;color:var(--mute)}
.brand b{color:var(--gold)}
.brand svg{width:26px;height:26px}
#track{display:flex;gap:4px;align-items:center}
.pip{width:15px;height:8px;border-radius:3px;background:#2a2548;transition:.3s}
.pip.f0.done,.pip.f0.now{background:#4aa3ff}.pip.f1.done,.pip.f1.now{background:#ffb347}.pip.f2.done,.pip.f2.now{background:#ff4d6d}
.pip.done{opacity:.4}.pip.now{box-shadow:0 0 0 2px #fff,0 0 14px currentColor;opacity:1}
.hudb{display:flex;gap:6px}
.ib{min-width:38px;height:38px;padding:0 11px;border-radius:12px;background:#1b1735;border:1px solid var(--line);color:var(--mute);font-size:13px;font-weight:800}
.ib:hover{border-color:#fff4;color:#fff}
#floor{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:0 2px 12px;flex-wrap:wrap}
#floor h1{margin:0;font-size:22px;font-weight:900;letter-spacing:.01em}
#floor h1 small{display:block;font-size:11px;letter-spacing:.2em;color:var(--accent);font-weight:800;margin-bottom:2px}
#floor .rt{font-size:13px;color:var(--mute)}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-weight:800;font-size:12px}
.b-red{background:#ff4d6d26;color:#ff8da3;border:1px solid #ff4d6d66}
.b-amb{background:#ffb34726;color:#ffc980;border:1px solid #ffb34766}
.b-grn{background:#4de2a126;color:#8df0c5;border:1px solid #4de2a166}
.b-blu{background:#6ea8ff22;color:#a9c8ff;border:1px solid #6ea8ff66}
/* forecast */

#arena{margin:0 0 12px}
.hall{position:relative;height:244px;border-radius:20px;overflow:hidden;border:1px solid #ffffff1c;
  background:radial-gradient(120% 90% at 50% 0%,color-mix(in srgb,var(--glow) 55%,transparent),transparent 62%),
  repeating-linear-gradient(90deg,#ffffff06 0 2px,transparent 2px 86px),linear-gradient(#0d0a1c,#080614);
  box-shadow:inset 0 0 60px #000a,0 14px 40px #0008;display:flex;align-items:flex-end;justify-content:space-between;padding:0 54px 16px;gap:12px}
.hall::before{content:"";position:absolute;inset:0;pointer-events:none;background:
  radial-gradient(60% 120% at 50% 130%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 70%),
  linear-gradient(90deg,#000b,transparent 22%,transparent 78%,#000b)}
.hall::after{display:none;content:"";position:absolute;left:0;right:0;top:0;height:34px;pointer-events:none;background:radial-gradient(40px 34px at 40px 0,transparent 98%,#0000),repeating-radial-gradient(60px 46px at 50% -14px,#05040c 0 44px,transparent 45px 70px);opacity:.9}
.hall{background-size:cover;background-position:center bottom}
.hall .lit{position:absolute;inset:0;pointer-events:none;z-index:2;mix-blend-mode:screen;background:radial-gradient(260px 200px at 5% 28%,#ff9a3c55,transparent 70%),radial-gradient(260px 200px at 95% 28%,#ff9a3c55,transparent 70%);animation:flick 1.9s steps(1) infinite}
@keyframes flick{0%{opacity:.85}12%{opacity:1}27%{opacity:.78}41%{opacity:.95}58%{opacity:.82}73%{opacity:1}88%{opacity:.88}}
.hall .fogl{position:absolute;inset:0;pointer-events:none;z-index:2;background:radial-gradient(90% 40% at 30% 100%,#ffffff14,transparent 70%),radial-gradient(70% 36% at 80% 96%,#ffffff10,transparent 70%),radial-gradient(130% 120% at 50% 40%,transparent 60%,#000a 100%);animation:fogm 11s ease-in-out infinite alternate}
@keyframes fogm{from{transform:translateX(-2%)}to{transform:translateX(2%)}}
.hall .fig svg,.hall .kn svg{filter:url(#m3d)}
.hall .kn svg{filter:url(#m3d) drop-shadow(0 8px 10px #000a)}
.hall .am .fig{filter:drop-shadow(0 10px 8px #000b)}
.floorline{position:absolute;left:0;right:0;bottom:0;height:20px;background:linear-gradient(#1b1630,#0a0814);border-top:1px solid #ffffff14}
.tch{position:absolute;top:62px;width:20px;height:58px;z-index:2}
.tch.l{left:16px}.tch.r{right:16px}
.tch::before{content:"";position:absolute;left:7px;top:22px;width:6px;height:36px;border-radius:3px;background:linear-gradient(#6b4a2a,#2c1d10)}
.tch u{position:absolute;left:1px;top:0;width:18px;height:28px;border-radius:50% 50% 45% 45%;background:radial-gradient(circle at 50% 70%,#fff6c9,#ffb347 45%,#ff4d6d00 75%);filter:blur(.5px) drop-shadow(0 0 14px #ffb347);animation:flame .7s ease-in-out infinite alternate}
.tch.r u{animation-delay:.25s}
@keyframes flame{from{transform:scale(.92,1) rotate(-3deg);opacity:.9}to{transform:scale(1.06,1.12) rotate(3deg);opacity:1}}
.knw{position:relative;z-index:1;display:flex;align-items:flex-end;gap:10px;flex:none}
.knw .kn{width:104px;height:126px;animation:breathe 3s ease-in-out infinite;transform-origin:50% 95%;filter:drop-shadow(0 6px 14px #5ea3ff55)}
.stash{display:flex;flex-direction:column-reverse;align-items:center;gap:1px;position:relative;min-width:58px;padding-bottom:2px}
.stash i{width:34px;height:7px;border-radius:50%;background:linear-gradient(#ffe08a,#e0a21d);box-shadow:0 1px 0 #7a5208,0 0 10px #ffcf5c33;transform:translateX(calc(((var(--i) * 7) % 5 - 2) * 1.4px))}
.stash span{position:absolute;bottom:-3px;left:50%;transform:translate(-50%,100%);font-size:11px;font-weight:800;color:var(--gold);white-space:nowrap;display:none}
.horde{position:relative;z-index:1;display:flex;align-items:flex-end;justify-content:flex-end;gap:2px;flex:1;min-width:0}
.am{display:flex;flex-direction:column;align-items:center;flex:0 1 auto;min-width:0}
.am .fig{width:92px;height:92px;scale:var(--s);transform-origin:50% 100%;margin-bottom:4px;animation-duration:calc(2.2s + var(--s) * .6s)}
.am b{font-size:11.5px;font-weight:800;color:#fff;background:#0009;border:1px solid color-mix(in srgb,var(--c) 60%,transparent);border-radius:99px;padding:1px 8px;margin-top:2px}
.win{align-self:center;margin:0 auto;text-align:center;font-weight:900;letter-spacing:.2em;font-size:18px;color:var(--gold);text-shadow:0 0 24px #ffcf5c}
.win small{display:block;letter-spacing:.04em;font-weight:600;font-size:12px;color:var(--mute);text-shadow:none;margin-top:4px}
@media(max-width:700px){.hall{height:148px;padding:0 34px 14px}.knw .kn{width:62px;height:76px}.stash{min-width:40px}.stash i{width:26px}.am .fig{width:52px;height:52px}.am b{font-size:10px;padding:1px 5px}.tch{display:none}.win{font-size:14px}}
@media(prefers-reduced-motion:reduce){.hall .lit,.hall .fogl{animation:none}.tch u,.knw .kn,.am .fig{animation:none}}
#forecast{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.fc{border-radius:16px;padding:10px 14px;border:1px solid var(--line);background:linear-gradient(180deg,#1b1735cc,#110e22cc)}
.fc small{display:block;color:var(--mute);font-size:10.5px;letter-spacing:.12em;font-weight:800}
.fc strong{font-size:27px;font-weight:900;line-height:1.15;font-variant-numeric:tabular-nums}
.fc em{display:block;font-style:normal;font-size:12px;color:var(--mute);margin-top:1px}
.fc.up{border-color:#ff4d6d66}.fc.up strong{color:var(--red)}
.fc.dn{border-color:#ffb34766}.fc.dn strong{color:var(--amber)}
.fc.sn.lo{border-color:#ff4d6d66}.fc.sn.lo strong{color:var(--red)}
.fc.sn.md{border-color:#ffb34766}.fc.sn.md strong{color:var(--amber)}
.fc.sn.hi{border-color:#4de2a166}.fc.sn.hi strong{color:var(--green)}
.meter{height:6px;border-radius:99px;background:#00000066;margin-top:7px;overflow:hidden}
.meter i{display:block;height:100%;background:currentColor;transition:width .5s}
.fc.sn.lo .meter{color:var(--red)}.fc.sn.md .meter{color:var(--amber)}.fc.sn.hi .meter{color:var(--green)}
#coach{margin:0 0 12px;padding:11px 15px;border-radius:14px;background:#6ea8ff1a;border:1px solid #6ea8ff66;color:#d5e5ff;font-size:14.5px;line-height:1.4;display:flex;gap:10px;align-items:center}
#coach b.n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--blue);color:#07142b;display:grid;place-items:center;font-size:13px}
#coach.hide{display:none}
/* layout */
main{display:grid;grid-template-columns:1.25fr 1fr;gap:14px}
.col h2{margin:4px 2px 9px;font-size:12.5px;letter-spacing:.17em;font-weight:900;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.col h2.d{color:var(--red)}.col h2.w{color:var(--gold)}
/* monsters */
#monsters{display:flex;flex-direction:column;gap:11px}
.mon{position:relative;display:grid;grid-template-columns:104px 1fr;gap:6px 12px;align-items:center;padding:11px;border-radius:18px;border:1px solid color-mix(in srgb,var(--c) 50%,#2a2548);background:linear-gradient(135deg,color-mix(in srgb,var(--c) 15%,#150f27),#0f0c1d);box-shadow:0 0 30px color-mix(in srgb,var(--c) 15%,transparent),inset 0 1px 0 #ffffff12}
.key{position:absolute;top:8px;right:10px;font-size:10.5px;font-weight:900;color:var(--mute);border:1px solid var(--line);border-radius:6px;padding:1px 6px;background:#0d0a1a}
.mon,.fc,#wallet>div{box-shadow:inset 0 1px 0 #ffffff14,inset 0 0 0 1px #ffffff05}
h1 em{background:linear-gradient(90deg,#ffe08a,#ffb347);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-style:normal;filter:drop-shadow(0 0 18px #ffb34766)}
.fig{width:98px;height:98px;display:grid;place-items:center;transform-origin:50% 90%;animation:breathe 2.6s ease-in-out infinite;filter:drop-shadow(0 8px 16px color-mix(in srgb,var(--c) 60%,transparent))}
.fig svg{width:100%;height:100%;overflow:visible}
@keyframes breathe{0%,100%{translate:0 0}50%{translate:0 -4px}}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
.info .nm{font-weight:900;font-size:16.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fast{font-size:10px;letter-spacing:.1em;font-weight:900;color:#ffd0da;background:#ff4d6d33;border:1px solid #ff4d6d99;border-radius:6px;padding:2px 6px}
.info .tag{font-size:12px;color:var(--mute);margin-bottom:6px}
.hp{height:10px;border-radius:99px;background:#00000066;overflow:hidden;border:1px solid #ffffff14;position:relative}
.hp i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--c),#ffffff55);transition:width .4s}
.hp u{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,#ff4d6d99 0 4px,#ff4d6d22 4px 8px);transition:all .4s}
.row{display:flex;justify-content:space-between;align-items:baseline;margin-top:7px;gap:8px;flex-wrap:wrap}
.debt{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.rate{font-size:12.5px;font-weight:800;color:#ff8da3;text-align:right}
.rate small{display:block;color:var(--mute);font-weight:600;font-size:11.5px}
.acts{grid-column:1/-1;display:flex;gap:8px}
.btn{flex:1;min-height:44px;padding:10px 12px;border-radius:13px;font-weight:800;font-size:14px;background:#221c40;border:1px solid var(--line);transition:transform .12s,border-color .12s,background .12s}
.btn:hover:not(:disabled){transform:translateY(-1px);border-color:#fff5}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.32;cursor:not-allowed}
.btn.pay{background:linear-gradient(180deg,#ff6b88,#e0334f);border-color:#ff9db1;color:#fff;text-shadow:0 1px 0 #0004}
.btn.all{background:#2a1c33}
.btn.glow{animation:glow 1.1s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 #6ea8ff88}50%{box-shadow:0 0 0 7px #6ea8ff00,0 0 20px 4px #6ea8ffbb}}
.mon.hit{animation:hit .35s}
@keyframes hit{0%,100%{transform:none}25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.mon.dead{animation:die .7s forwards}
@keyframes die{to{opacity:0;transform:scale(.6) rotate(6deg);filter:blur(3px)}}
.empty{padding:26px;border-radius:18px;text-align:center;border:1px dashed #4de2a199;color:#8df0c5;background:#4de2a10d;font-weight:800;line-height:1.4}
/* wallet */
.cash{padding:15px;border-radius:18px;border:1px solid #ffcf5c55;background:linear-gradient(135deg,#2a2110,#14101f);box-shadow:0 0 34px #ffcf5c14,inset 0 1px 0 #ffffff12;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.cash .big{font-size:42px;font-weight:900;color:var(--gold);line-height:1;font-variant-numeric:tabular-nums}
.cash .sub{display:flex;gap:8px;align-items:center;margin-top:9px;flex-wrap:wrap;color:var(--mute);font-size:13px}
.pp{display:grid;justify-items:center;gap:2px;font-size:11px;color:var(--mute);text-align:center}
.pp b{font-size:15px;color:var(--gold)}
.ring{width:62px;height:62px}
.assets{display:flex;flex-direction:column;gap:9px;margin-top:11px}
.asset{display:grid;grid-template-columns:42px 1fr auto;gap:2px 11px;align-items:center;padding:11px;border-radius:15px;border:1px solid var(--line);background:#120f22cc}
.asset .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:#1e1a3a;grid-row:1/3}
.asset .nm{font-weight:800;font-size:14.5px}
.asset .nm small{color:var(--mute);font-weight:600;margin-left:5px}
.asset .val{font-weight:900;font-size:19px;text-align:right;font-variant-numeric:tabular-nums}
.asset .ln{font-size:12px;color:var(--mute)}
.asset .ab{grid-column:1/-1;display:flex;gap:8px;margin-top:7px}
.asset .btn{min-height:40px;padding:8px;font-size:13px}
.real.neg{color:#ff8da3}.real.pos{color:#8df0c5}
.nw{margin-top:11px;padding:12px 14px;border-radius:15px;background:#1b1735cc;border:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center}
.nw span{font-weight:800;font-size:13.5px}
.nw b{font-size:20px;font-variant-numeric:tabular-nums}
.nw .spark{grid-row:1/3;grid-column:2;width:120px;height:34px;justify-self:end;color:var(--accent)}
.nw small{color:var(--mute);font-size:12px}
.xpbox{margin:14px 0 4px;padding:12px 14px;border-radius:14px;border:1px solid #ffcf5c55;background:#ffcf5c10}
.xpbox .xr{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}.xpbox b{color:var(--gold);font-size:18px}.xpbox small{display:block;margin-top:7px;color:var(--mute);font-size:12.5px;line-height:1.4}
.lvup{font-style:normal;color:#06050c;background:var(--gold);padding:2px 7px;border-radius:8px;font-weight:900;font-size:11px;margin-left:6px}
.xpbox .meter{color:var(--gold)}
.lvl{text-align:center;color:var(--mute);font-size:13px;margin:-4px 0 10px}.lvl b{color:var(--gold)}
.budget{margin-top:11px;padding:13px 14px;border-radius:18px;border:1px solid #6ea8ff44;background:linear-gradient(#6ea8ff10,#ffffff04)}
.bh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}.bh b{font-size:11.5px;letter-spacing:.16em;color:#8db8ff}.bh span{font-size:11.5px;color:var(--mute)}
.bl{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:4px 0}.bl span{font-size:14px;font-weight:700}.bl small{display:block;font-weight:500;font-size:11.5px;color:var(--mute)}.bl b{font-size:16px}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:2px 0 8px;padding:3px;border-radius:12px;background:#0c0919;border:1px solid var(--line)}
.seg3 button{min-height:38px;border-radius:9px;font-weight:800;font-size:13px;color:var(--mute)}.seg3 button.on{background:linear-gradient(#2c2552,#201a40);color:#fff;box-shadow:inset 0 0 0 1px #6ea8ff88}
.free{display:flex;justify-content:space-between;align-items:center;margin-top:6px;padding:9px 12px;border-radius:12px;background:#4de2a114;border:1px solid #4de2a155}.free span{font-size:13px;font-weight:700}.free b{font-size:18px;color:var(--green)}
.goal{margin-top:10px}.goal span{font-size:12.5px;font-weight:700}.goal small{display:block;margin-top:5px;font-size:12px;color:var(--mute)}.goal .meter{color:var(--green)}
.opts{display:grid;gap:10px;margin:16px 0 4px}.opt{text-align:left;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:#ffffff08;min-height:64px}
.opt b{display:block;font-size:16px;margin-bottom:3px}.opt span{font-size:13px;color:var(--mute);line-height:1.4}.opt:hover,.opt:focus-visible{border-color:#6ea8ff;background:#6ea8ff14}
.shield{margin-top:11px;display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:16px;border:1px solid #ffffff1f;background:#ffffff08}
.shield.on{border-color:#4de2a1aa;background:#4de2a114}
.shield .si{font-size:22px;width:30px;text-align:center}
.shield .st{flex:1;min-width:0}.shield .st b{display:block;font-size:14.5px}.shield .st small{display:block;font-size:12px;color:var(--mute);line-height:1.35}
.tempt{margin-top:11px;padding:13px 14px;border-radius:16px;border:1px dashed #6ea8ffaa;background:#6ea8ff12}
.tempt small{display:block;font-size:10.5px;letter-spacing:.13em;font-weight:800;color:#9fc0ff}
.tempt .tn{font-weight:800;margin:5px 0 9px;display:flex;justify-content:space-between;gap:8px;font-size:15.5px}
.tempt .tn b{color:var(--gold)}
.tempt .tb{display:flex;gap:7px;flex-wrap:wrap}
.tempt .btn{min-width:92px;font-size:13px}
/* bottom bar */

const A={ctx:null,master:null,amb:null,on:store.get("sound")!=="off"};
function aInit(){
  if(A.ctx)return;
  try{
    A.ctx=new(window.AudioContext||window.webkitAudioContext)();
    A.master=A.ctx.createGain();A.master.gain.value=A.on?1:0;A.master.connect(A.ctx.destination);
    const c=A.ctx,g=c.createGain();g.gain.value=.03;
    const f=c.createBiquadFilter();f.type="lowpass";f.frequency.value=320;f.Q.value=3;
    const o1=c.createOscillator(),o2=c.createOscillator(),lfo=c.createOscillator(),lg=c.createGain();
    o1.type="sawtooth";o2.type="triangle";o1.frequency.value=55;o2.frequency.value=82.4;
    lfo.frequency.value=.07;lg.gain.value=140;lfo.connect(lg);lg.connect(f.frequency);
    o1.connect(f);o2.connect(f);f.connect(g);g.connect(A.master);
    [o1,o2,lfo].forEach(o=>o.start());A.amb={o1,o2,f};ambFloor(floorOf(S?S.month:1));
  }catch(e){A.ctx=null}
}
function ambFloor(fl){
  if(!A.amb)return;const t=A.ctx.currentTime,r=[55,49,46.25][fl];
  A.amb.o1.frequency.setTargetAtTime(r,t,1.5);A.amb.o2.frequency.setTargetAtTime(fl===2?r*1.414:r*1.5,t,1.5);
  A.amb.f.frequency.setTargetAtTime([320,380,470][fl],t,1.5);
}
function beep(f,d=.08,t="square",v=.035){
  if(!A.on||!A.ctx)return;
  try{const c=A.ctx,o=c.createOscillator(),g=c.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;
    o.connect(g);g.connect(A.master);o.start();g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+d);o.stop(c.currentTime+d)}catch(e){}
}

/* ---------- visual FX ---------- */
let bgRun=false;
function bgInit(){
  const c=$("#bg");let ctx;try{ctx=c.getContext("2d")}catch(e){}
  if(!ctx)return;
  let W,H,ps=[];const pal=[[90,170,255],[255,179,71],[255,77,109]];
  function size(){W=c.width=innerWidth;H=c.height=innerHeight;
    ps=Array.from({length:Math.min(70,Math.round(W*H/22000))},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2+.6,v:Math.random()*.4+.15,a:Math.random()*.5+.15,p:Math.random()*6}))}
  size();addEventListener("resize",size);
  function frame(t){
    ctx.clearRect(0,0,W,H);const fl=+(document.body.dataset.floor||0),col=pal[fl];
    ctx.globalCompositeOperation="lighter";
    for(const p of ps){p.y-=p.v*(1+fl*.6);p.x+=Math.sin(t/1800+p.p)*.25;if(p.y<-4){p.y=H+4;p.x=Math.random()*W}
      ctx.beginPath();ctx.fillStyle=`rgba(${col[0]},${col[1]},${col[2]},${(p.a*(.6+.4*Math.sin(t/700+p.p))).toFixed(3)})`;ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fill()}
    ctx.globalCompositeOperation="source-over";
    if(!REDUCED&&!document.hidden)requestAnimationFrame(frame);else bgRun=false;
  }
  const start=()=>{if(bgRun)return;bgRun=true;requestAnimationFrame(frame)};
  start();document.addEventListener("visibilitychange",()=>{if(!document.hidden)start()});
}
const fx={ctx:null,ps:[],on:false,W:0,H:0};
function fxInit(){
  const c=$("#fx");try{fx.ctx=c.getContext("2d")}catch(e){}
  if(!fx.ctx)return;const s=()=>{c.width=fx.W=innerWidth;c.height=fx.H=innerHeight};s();addEventListener("resize",s);
}
function burst(x,y,o){
  if(!fx.ctx||REDUCED)return;const n=o.n||16;
  for(let i=0;i<n;i++){const a=Math.random()*6.283,s=(o.s||5)*(.3+Math.random());
    fx.ps.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-(o.up||0),g:o.g===undefined?.18:o.g,l:o.l||46,m:o.l||46,r:(o.r||3.2)*(.6+Math.random()),c:o.c||"#fff",coin:!!o.coin})}
  if(!fx.on){fx.on=true;requestAnimationFrame(fxLoop)}
}
function fxLoop(){
  const ctx=fx.ctx;ctx.clearRect(0,0,fx.W,fx.H);fx.ps=fx.ps.filter(p=>p.l>0);
  for(const p of fx.ps){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=.99;p.l--;ctx.globalAlpha=Math.max(0,p.l/p.m);ctx.fillStyle=p.c;
    if(p.coin){ctx.beginPath();ctx.ellipse(p.x,p.y,p.r,Math.max(.4,p.r*Math.abs(Math.cos(p.l/4))),0,0,6.283);ctx.fill()}
    else ctx.fillRect(p.x-p.r/2,p.y-p.r/2,p.r,p.r)}
  ctx.globalAlpha=1;
  if(fx.ps.length)requestAnimationFrame(fxLoop);else{fx.on=false;ctx.clearRect(0,0,fx.W,fx.H)}
}
const centerOf=el=>{const r=el.getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/2]};
function flash(color){const f=$("#flash");f.style.setProperty("--fc",color);f.classList.remove("go");void f.offsetWidth;f.classList.add("go")}
let trauma=0,shkT=0,shkOn=false;
function shake(t){if(REDUCED)return;trauma=Math.min(1,trauma+(t===undefined?.6:t));if(!shkOn){shkOn=true;shkT=performance.now();requestAnimationFrame(shkLoop)}}
function shkLoop(now){const a=$("#app"),dt=Math.min(.05,(now-shkT)/1000);shkT=now;trauma=Math.max(0,trauma-1.2*dt);
  const k=trauma*trauma,x=Math.sin(now/22)*10*k,y=Math.sin(now/17+2)*7*k;
  a.style.transform=k>.002?`translate(${x.toFixed(1)}px,${y.toFixed(1)}px)`:"";
  if(trauma>0)requestAnimationFrame(shkLoop);else{shkOn=false;a.style.transform=""}}
function floatText(el,txt,color){
  if(!el)return;const r=el.getBoundingClientRect(),s=document.createElement("div");
  s.className="fl";s.textContent=txt;s.style.color=color;s.style.left=(r.left+r.width/2-30)+"px";s.style.top=(r.top+r.height/3)+"px";
  document.body.appendChild(s);setTimeout(()=>s.remove(),1000);
}
const shown={};
function animateNums(){
  document.querySelectorAll("[data-num]").forEach(el=>{
    const k=el.dataset.num,v=+el.dataset.v,f=FM[el.dataset.f]||fmt,from=shown[k];shown[k]=v;
    if(from===undefined||from===v||REDUCED)return;
    const t0=performance.now(),D=450;
    (function step(t){const p=Math.min(1,(t-t0)/D),e=1-Math.pow(1-p,3);
      if(!el.isConnected)return;el.textContent=f(from+(v-from)*e);if(p<1)requestAnimationFrame(step);else el.textContent=f(v)})(t0);
  });
}

/* ---------- procedural stone dungeon backdrop (no external assets) ---------- */
const HALLTEX={};
function hallTex(fl){
  if(HALLTEX[fl])return HALLTEX[fl];
  try{
  const W=1400,H=480,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
  let seed=1234+fl*977;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const tint=[[92,98,118],[112,92,78],[118,70,76]][fl],horizon=292;
  // wall bricks
  const bh=46,bw=104;
  for(let r=0,y=0;y<horizon+bh;r++,y+=bh){const off=(r%2)*bw/2;
    for(let bx=-bw;bx<W+bw;bx+=bw){const v=.95+rnd()*.6;
      const w=bw-4+rnd()*3;x.fillStyle=`rgb(${tint[0]*v|0},${tint[1]*v|0},${tint[2]*v|0})`;x.fillRect(bx+off,y,w,bh-4);
      const g=x.createLinearGradient(0,y,0,y+bh);g.addColorStop(0,"#ffffff26");g.addColorStop(.12,"#ffffff0a");g.addColorStop(.85,"#0000");g.addColorStop(1,"#0007");x.fillStyle=g;x.fillRect(bx+off,y,w,bh-4);
      x.fillStyle="#ffffff12";x.fillRect(bx+off,y,2,bh-4);x.fillStyle="#0005";x.fillRect(bx+off+w-3,y,3,bh-4)}}
  x.fillStyle="#07060b";
  for(let y=0;y<horizon+bh;y+=bh){x.globalAlpha=.9;x.fillRect(0,y+bh-4,W,4)}x.globalAlpha=1;
  // floor perspective
  const fg=x.createLinearGradient(0,horizon,0,H);fg.addColorStop(0,`rgb(${tint[0]*.28|0},${tint[1]*.28|0},${tint[2]*.3|0})`);fg.addColorStop(1,`rgb(${tint[0]*.5|0},${tint[1]*.5|0},${tint[2]*.5|0})`);
  x.fillStyle=fg;x.fillRect(0,horizon,W,H-horizon);
  x.strokeStyle="#05040a";x.lineWidth=3;let yy=horizon,hh=10;
  while(yy<H){x.globalAlpha=.9;x.beginPath();x.moveTo(0,yy);x.lineTo(W,yy);x.stroke();
    const k=(yy-horizon+hh)/(H-horizon+60);for(let i=-14;i<=14;i++){const bx=W/2+i*(70+k*160),tx=W/2+i*70;x.beginPath();x.moveTo(tx+(rnd()*6-3),yy);x.lineTo(bx,yy+hh+4);x.stroke()}
    yy+=hh;hh*=1.28}
  x.globalAlpha=1;
  // floor sheen
  const sh=x.createLinearGradient(0,horizon,0,H);sh.addColorStop(0,"#0000");sh.addColorStop(.5,"#ffffff10");sh.addColorStop(1,"#0000");x.fillStyle=sh;x.fillRect(0,horizon,W,H-horizon);
  // grime, cracks, moss/stains
  for(let i=0;i<46;i++){const px=rnd()*W,py=rnd()*horizon,r=30+rnd()*120;const gr=x.createRadialGradient(px,py,0,px,py,r);
    gr.addColorStop(0,fl===0?"#1e3a2a66":"#00000055");gr.addColorStop(1,"#0000");x.fillStyle=gr;x.fillRect(px-r,py-r,r*2,r*2)}
  x.strokeStyle="#0009";x.lineWidth=1.6;for(let i=0;i<16;i++){let px=rnd()*W,py=rnd()*horizon;x.beginPath();x.moveTo(px,py);for(let j=0;j<6;j++){px+=rnd()*18-9;py+=8+rnd()*14;x.lineTo(px,py)}x.stroke()}
  // arch shadow band at top + dripping dark
  const tg=x.createLinearGradient(0,0,0,120);tg.addColorStop(0,"#000d");tg.addColorStop(1,"#0000");x.fillStyle=tg;x.fillRect(0,0,W,120);
  // film grain
  const id=x.getImageData(0,0,W,H),d=id.data;for(let i=0;i<d.length;i+=4){const n=(rnd()-.5)*34;d[i]+=n;d[i+1]+=n;d[i+2]+=n}x.putImageData(id,0,0);
  // dark ambient (torch light added live by CSS)
  const am=x.createLinearGradient(0,0,W,0);am.addColorStop(0,"#0000");am.addColorStop(.5,"#0004");am.addColorStop(1,"#0000");x.fillStyle=am;x.fillRect(0,0,W,H);
  x.fillStyle="#0a08122a";x.fillRect(0,0,W,H);
  // baked torch pools (left/right)
  x.globalCompositeOperation="lighter";[.05,.95].forEach(f=>{const g=x.createRadialGradient(W*f,140,10,W*f,140,380);g.addColorStop(0,"#ffb45ccc");g.addColorStop(.35,"#d9702a66");g.addColorStop(1,"#0000");x.fillStyle=g;x.fillRect(0,0,W,H)});

function spark(vals,w,h,cls){
  if(vals.length<2)return"";
  const mn=Math.min(...vals,0),mx=Math.max(...vals,0),span=(mx-mn)||1;
  const pts=vals.map((v,i)=>[(i/(vals.length-1))*w,h-((v-mn)/span)*(h-4)-2]);
  const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join("");
  const zy=h-((0-mn)/span)*(h-4)-2;
  return `<svg viewBox="0 0 ${w} ${h}" class="${cls}" preserveAspectRatio="none" aria-hidden="true"><line x1="0" x2="${w}" y1="${zy.toFixed(1)}" y2="${zy.toFixed(1)}" stroke="#ffffff38" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/><path d="${d}" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`;
}
function ring(p){
  const r=22,c=2*Math.PI*r;
  return `<svg class="ring" viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="${r}" fill="none" stroke="#ffffff16" stroke-width="6"/><circle cx="28" cy="28" r="${r}" fill="none" stroke="var(--gold)" stroke-width="6" stroke-linecap="round" stroke-dasharray="${(c*Math.max(.02,p)).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 28 28)"/></svg>`;
}

function addMon(key,debt){
  const t=MON[key],d=debt===undefined?t.debt:debt,ex=S.mons.find(m=>m.key===key);
  if(ex){ex.debt+=d;ex.ref=Math.max(ex.ref,ex.debt,300);return ex}
  const m=Object.assign({id:S.nid++,key,debt:d,ref:Math.max(d,300)},t,{debt:d});S.mons.push(m);return m;
}
function newGame(tier,mode){

  if(mode==="daily"){label=new Date().toISOString().slice(0,10);seed=hashStr(label+"|"+tier+(REGION==="gulf"?"|gulf":""));R=mulberry32(seed)}else R=Math.random;
  const t0=TIERS[tier];
  S={tier,mode,label,seed,month:1,cash:t0.cash,assets:{vault:0,index:0,dragon:0,orbit:0},mons:[],pp:1,over:false,done:false,
     stats:{interest:0,infl:0,inv:0,seen:0,bought:0,onCard:0,gap:0,pays:0,payOK:0,emerg:0,divMonths:0,acts:0,insPaid:0,insSaved:0,insHit:0,saved:0,saveMonths:0,fundUsed:0,raiseLife:0,raises:0,living:0,billDebt:0,shocks:0,orbitMonths:0,skill:0,skillMonth:0,skillLoan:0,waste:0,idle:0},

function rollTemptation(){
  S.temp=null;
  if(!S.opp&&!S.stats.skill&&S.month>=2&&S.month<=7&&R()<.4)S.opp={cost:sc(450),gain:.12};
  else if(S.month>7)S.opp=null;
  if(S.opp&&S.month>=2)return;
  if(S.month<2||R()>T().tempFreq)return;
  const t=tpPool()[Math.floor(R()*tpPool().length)];S.temp={name:t.name,cost:sc(t.base)};S.stats.seen++;
}
function buyTemp(onCard){

"A raise is the best moment to save. Spend it on lifestyle and it vanishes, which is how high earners stay stuck.":"العلاوة أفضل لحظة للادخار. أنفقها على نمط الحياة فتختفي، وهكذا يبقى أصحاب الدخل المرتفع عالقين.",
"Pay yourself first. Even 10% of pay into savings turns the next surprise bill into a non-event.":"ادّخر أولًا. حتى 10% من الراتب في المدخرات تجعل الفاتورة المفاجئة القادمة أمرًا عابرًا.",
"Keep roughly one surprise bill in cash. Without it, a single shock becomes a 15%-a-month Emergency Imp.":"احتفظ بما يعادل فاتورة مفاجئة نقدًا. بدونه تتحول صدمة واحدة إلى عفريت طوارئ بفائدة 15% شهريًا.",
